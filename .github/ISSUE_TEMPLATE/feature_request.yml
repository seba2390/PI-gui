name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: pi
    attributes:
      label: Does pi's terminal already do this?
      description: Pistachio mirrors pi; if this is agent behaviour, it may belong in pi itself.
