name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux system libraries (GPUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libzstd-dev libasound2-dev
      # Saved from main only: a pull request's cache serves only that pull request, and the
      # 10 GB the repository has for caches is better kept for main's (which pull requests use).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # sherpa-onnx-sys downloads its prebuilt libraries into target/sherpa-onnx-prebuilt and
      # skips the download whenever that folder's lib/ exists. rust-cache keeps the folder and
      # the build script's fingerprint but not the library files, so linking then fails. If
      # the library itself is missing, drop the folder and the crate's build outputs.
      - name: Re-fetch sherpa-onnx libraries the cache dropped
        shell: bash
        run: |
            if ! ls target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api* >/dev/null 2>&1; then
              rm -rf target/sherpa-onnx-prebuilt \
                target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* \
                target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*
            fi
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows:
    name: build + clippy (windows-latest)
    # Windows support is experimental: everything (including tests) must compile and pass
    # clippy; the test suite itself runs on macOS and Linux (many tests drive /bin/sh).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Saved from main only: a pull request's cache serves only that pull request, and the
      # 10 GB the repository has for caches is better kept for main's (which pull requests use).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # sherpa-onnx-sys downloads its prebuilt libraries into target/sherpa-onnx-prebuilt and
      # skips the download whenever that folder's lib/ exists. rust-cache keeps the folder and
      # the build script's fingerprint but not the library files, so linking then fails. If
      # the library itself is missing, drop the folder and the crate's build outputs.
      - name: Re-fetch sherpa-onnx libraries the cache dropped
        shell: bash
        run: |
            if ! ls target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api* >/dev/null 2>&1; then
              rm -rf target/sherpa-onnx-prebuilt \
                target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* \
                target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*
            fi
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
