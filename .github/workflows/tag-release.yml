name: Tag release

# When a release is merged (main has a new version in Cargo.toml and a dated changelog section
# for it), tags that commit `v<version>` and starts release.yml, which builds and publishes it.
# Any other push to main changes nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release

jobs:
  tag:
    name: Tag a merged release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(script/release-tag.sh)"
          [[ -n "$tag" ]] || exit 0
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Pistachio ${tag#v}"
            git push origin "refs/tags/$tag"
          fi
          # A tag pushed with the workflow's token starts no workflow by itself.
          # GitHub sometimes answers with a server error, so this tries again for a few minutes. The
          # answer can also get lost after the release started: it must not start twice, so each
          # try is only made once it is known that none has.
          since="$(date -u -d '1 minute ago' +%FT%TZ)"
          for wait in 15 30 60 90 120 1; do
            started="$(gh run list --workflow release.yml --branch "$tag" --created ">=$since" --json databaseId --jq length || true)"
            if [[ "$started" == 0 ]]; then
              if gh workflow run release.yml --ref "$tag"; then exit 0; fi
            elif [[ -n "$started" ]]; then
              exit 0
            fi
            sleep "$wait"
          done
          echo "Could not start the release: run the Release workflow on $tag by hand" >&2
          exit 1
