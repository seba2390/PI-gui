[package]
name = "sandbox"
description = "The sandbox the agent's commands run in, in pistachio's local Code sessions: its settings, Seatbelt (macOS), bubblewrap and Landlock (Linux)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# The kernel's own sandbox for unprivileged processes, where bubblewrap can't run.
landlock = "0.4.4"

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

[lints]
workspace = true
