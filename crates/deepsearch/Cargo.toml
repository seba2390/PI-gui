[package]
name = "deepsearch"
description = "Web search and page reading for pistachio's deep search: backends, safe fetching, extraction, ranking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
searxng.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The versions gpui already links, so HTML parsing adds no code.
html5ever = "0.40"
markup5ever_rcdom = "0.40"
url = "2"
# Exact: the address check uses ureq's `unversioned` resolver API, which may change in any release.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

[lints]
workspace = true
