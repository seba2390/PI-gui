[package]
name = "pistachio"
description = "A lean desktop GUI for the pi coding agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pistachio"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
deepsearch.workspace = true
pi-config.workspace = true
pi-rpc.workspace = true
pi-sessions.workspace = true
remote.workspace = true
transcript.workspace = true
workspace.workspace = true
term.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
base64 = "0.23"
trash = "5"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
pretty_assertions.workspace = true
futures.workspace = true
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
